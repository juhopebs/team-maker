<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>풋살 팀 짜기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background:#fafafa; }
    @keyframes riseIn { from {opacity:0; transform:translateY(8px);} to {opacity:1; transform:none;} }
    .rise { animation: riseIn .28s cubic-bezier(.2,.7,.2,1) both; }
    @media (prefers-reduced-motion: reduce){ .rise{animation:none;} }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    /* =====================================================================
       팀 명단 — 여기(ROSTER)만 고치면 됩니다.
       tier 값: 1=상  2=중상  3=중  4=중하  5=하
       ※ 등급(tier)은 팀 균형 계산에만 쓰이고 화면에는 표시되지 않습니다.
       ===================================================================== */
    const ROSTER = [
      { name: "이주호", tier: 1 },
      { name: "Juno Yoon", tier: 2 },
      { name: "kim현식", tier: 3 },
      { name: "Won", tier: 1 },
      { name: "갑", tier: 1 },
      { name: "강정훈", tier: 1 },
      { name: "고준혁", tier: 5 },
      { name: "근", tier: 2 },
      { name: "김뒤", tier: 5 },
      { name: "김만겸", tier: 5 },
      { name: "김선률", tier: 3 },
      { name: "도헌", tier: 5 },
      { name: "민상", tier: 5 },
      { name: "박신웅", tier: 3 },
      { name: "설인수", tier: 2 },
      { name: "송주한", tier: 2 },
      { name: "송태영", tier: 3 },
      { name: "오성언", tier: 2 },
      { name: "오창석", tier: 3 },
      { name: "이규빈", tier: 3 },
      { name: "이성빈", tier: 3 },
      { name: "정성규", tier: 4 },
      { name: "조남인", tier: 5 },
      { name: "지원", tier: 4 },
      { name: "최경혁", tier: 3 },
      { name: "최재원", tier: 4 },
      { name: "한대현", tier: 1 },
      { name: "허성철", tier: 2 },
      { name: "허원석", tier: 5 },
    ];

    const TEAM_STYLES = [
      { name: "초록", emoji: "🟢", bar: "bg-emerald-500" },
      { name: "파랑", emoji: "🔵", bar: "bg-sky-500" },
      { name: "주황", emoji: "🟠", bar: "bg-amber-500" },
      { name: "빨강", emoji: "🔴", bar: "bg-rose-500" },
    ];
    const TIER_ORDER = [1, 2, 3, 4, 5];

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    const byName = (a, b) => a.name.localeCompare(b.name, "ko");

    // 등급별로 섞은 뒤 스네이크 순서로 배분 → 팀마다 실력 고르게, 매번 다르게
    function buildTeams(attendees, n) {
      const byTier = {};
      TIER_ORDER.forEach((t) => (byTier[t] = []));
      attendees.forEach((p) => (byTier[p.tier] || (byTier[p.tier] = [])).push(p));
      const flat = TIER_ORDER.flatMap((t) => shuffle(byTier[t] || []));
      const teams = Array.from({ length: n }, () => []);
      const cycle = 2 * n;
      const start = Math.floor(Math.random() * n);
      flat.forEach((p, step) => {
        const m = (start + step) % cycle;
        const idx = m < n ? m : cycle - 1 - m;
        teams[idx].push(p);
      });
      return teams;
    }

    /* 아이콘 (lucide 경로 인라인) */
    const ICheck = ({ size = 16, sw = 3 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
    );
    const ICopy = ({ size = 16 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </svg>
    );
    const IShuffle = ({ size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22" />
        <path d="m18 2 4 4-4 4" />
        <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2" />
        <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8" />
        <path d="m18 14 4 4-4 4" />
      </svg>
    );

    function App() {
      const roster = useMemo(() => ROSTER.map((p, i) => ({ ...p, id: i })), []);
      const sorted = useMemo(() => [...roster].sort(byName), [roster]);

      const [present, setPresent] = useState(() => new Set());
      const [numTeams, setNumTeams] = useState(2);
      const [teams, setTeams] = useState(null);
      const [copied, setCopied] = useState(false);
      const [showText, setShowText] = useState(false);

      const attendees = useMemo(() => roster.filter((p) => present.has(p.id)), [roster, present]);
      const enough = attendees.length >= Math.max(2, numTeams);

      useEffect(() => { setTeams(null); }, [present, numTeams]);

      const toggle = (id) =>
        setPresent((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const allOn = () => setPresent(new Set(roster.map((p) => p.id)));
      const allOff = () => setPresent(new Set());
      const make = () => { if (enough) setTeams(buildTeams(attendees, numTeams)); };

      const shareText = useMemo(() => {
        if (!teams) return "";
        const head = `⚽ 오늘의 풋살 팀 (${teams.length}팀 · ${attendees.length}명)\n\n`;
        return head + teams.map((t, i) => {
          const names = t.slice().sort(byName);
          return `${TEAM_STYLES[i].emoji} ${TEAM_STYLES[i].name} (${t.length})\n` +
            names.map((p) => `· ${p.name}`).join("\n");
        }).join("\n\n");
      }, [teams, attendees.length]);

      const copy = async () => {
        try {
          await navigator.clipboard.writeText(shareText);
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);
        } catch { setShowText(true); }
      };

      return (
        <div className="min-h-screen bg-neutral-50 font-sans text-zinc-900">
          <div className="mx-auto max-w-xl px-4 pb-24">
            <header className="flex items-baseline justify-between px-1 pt-6 pb-4">
              <div>
                <div className="font-mono text-[11px] uppercase tracking-[0.2em] text-zinc-400">TEAM MAKER</div>
                <h1 className="text-2xl font-bold tracking-tight">풋살 팀 짜기</h1>
              </div>
              <div className="text-right font-mono text-xs text-zinc-400">참석 {attendees.length} / {roster.length}</div>
            </header>

            <section className="rounded-2xl bg-white p-4 ring-1 ring-zinc-200">
              <div className="flex items-center justify-between">
                <span className="font-mono text-[11px] uppercase tracking-[0.2em] text-zinc-400">오늘 참석</span>
                <div className="flex gap-1.5">
                  <button onClick={allOn} className="rounded-md bg-zinc-100 px-2.5 py-1 text-xs font-medium hover:bg-zinc-200">전체</button>
                  <button onClick={allOff} className="rounded-md bg-zinc-100 px-2.5 py-1 text-xs font-medium hover:bg-zinc-200">해제</button>
                </div>
              </div>
              <ul className="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-3">
                {sorted.map((p) => {
                  const on = present.has(p.id);
                  return (
                    <li key={p.id}>
                      <button onClick={() => toggle(p.id)}
                        className={"flex w-full items-center gap-2 rounded-xl px-3 py-2.5 text-left text-sm ring-1 transition " +
                          (on ? "bg-zinc-900 text-white ring-zinc-900" : "bg-white text-zinc-500 ring-zinc-200 hover:ring-zinc-300")}>
                        <span className={"flex h-5 w-5 shrink-0 items-center justify-center rounded-full " + (on ? "bg-white text-zinc-900" : "ring-1 ring-zinc-300")}>
                          {on && <ICheck size={13} sw={3} />}
                        </span>
                        <span className="truncate">{p.name}</span>
                      </button>
                    </li>
                  );
                })}
              </ul>
            </section>

            <section className="mt-4 rounded-2xl bg-white p-4 ring-1 ring-zinc-200">
              <div className="flex items-center justify-between">
                <span className="font-mono text-[11px] uppercase tracking-[0.2em] text-zinc-400">팀 수</span>
                <div className="flex gap-1.5">
                  {[2, 3, 4].map((k) => (
                    <button key={k} onClick={() => setNumTeams(k)}
                      className={"h-9 w-9 rounded-lg font-mono text-sm " + (numTeams === k ? "bg-zinc-900 text-white" : "bg-zinc-100 text-zinc-600 hover:bg-zinc-200")}>
                      {k}
                    </button>
                  ))}
                </div>
              </div>
              {!enough && (
                <p className="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-700 ring-1 ring-amber-200">
                  참석자를 {Math.max(2, numTeams)}명 이상 선택하면 팀을 짤 수 있어요.
                </p>
              )}
              <button onClick={make} disabled={!enough}
                className="mt-3 flex w-full items-center justify-center gap-2 rounded-xl bg-zinc-900 py-3.5 text-base font-semibold text-white transition hover:bg-zinc-700 disabled:cursor-not-allowed disabled:bg-zinc-200 disabled:text-zinc-400">
                <IShuffle size={18} />
                {teams ? "다시 섞기" : "팀 짜기"}
              </button>
            </section>

            {teams && (
              <div className="mt-4 space-y-3">
                <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                  {teams.map((team, i) => {
                    const s = TEAM_STYLES[i];
                    const names = team.slice().sort(byName);
                    return (
                      <div key={i} className="rise overflow-hidden rounded-2xl bg-white ring-1 ring-zinc-200" style={{ animationDelay: (i * 60) + "ms" }}>
                        <div className={"flex items-center justify-between px-4 py-2.5 " + s.bar}>
                          <span className="font-semibold text-white">{s.name} 조끼</span>
                          <span className="font-mono text-sm text-white/90">{team.length}명</span>
                        </div>
                        <ul className="divide-y divide-zinc-100">
                          {names.map((p) => (<li key={p.id} className="px-4 py-2 text-sm">{p.name}</li>))}
                        </ul>
                      </div>
                    );
                  })}
                </div>

                <div className="flex gap-2">
                  <button onClick={copy} className="flex flex-1 items-center justify-center gap-2 rounded-xl bg-zinc-900 py-2.5 text-sm font-medium text-white hover:bg-zinc-700">
                    {copied ? <ICheck size={16} sw={3} /> : <ICopy size={16} />}
                    {copied ? "복사됨" : "결과 복사"}
                  </button>
                  <button onClick={() => setShowText((v) => !v)} className="rounded-xl bg-zinc-100 px-4 py-2.5 text-sm font-medium text-zinc-600 hover:bg-zinc-200">텍스트</button>
                </div>
                {showText && (
                  <textarea readOnly value={shareText} rows={Math.min(3 + attendees.length + teams.length, 16)}
                    onFocus={(e) => e.target.select()}
                    className="w-full rounded-xl border border-zinc-300 bg-white p-3 font-mono text-xs text-zinc-700" />
                )}
              </div>
            )}

            {attendees.length === 0 && !teams && (
              <p className="mt-6 text-center text-sm text-zinc-400">위에서 오늘 온 사람을 체크하세요.</p>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
